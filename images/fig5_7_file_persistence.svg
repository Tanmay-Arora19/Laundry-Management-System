<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Window Container -->
  <rect x="5" y="5" width="840" height="490" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Window Titlebar -->
  <rect x="5" y="5" width="840" height="36" rx="10" fill="#1C2541"/>
  <rect x="5" y="30" width="840" height="11" fill="#1C2541"/>
  
  <!-- Window Controls -->
  <circle cx="25" cy="22" r="6" fill="#EF4444"/>
  <circle cx="43" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="61" cy="22" r="6" fill="#10B981"/>
  
  <!-- Title -->
  <text x="425" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Terminal - Option 7 & 8: File Persistence & Backup</text>
  
  <!-- Terminal Content Area -->
  <g>
    <text x="24" y="65" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#FCD34D">Enter your choice: 7</text>
<text x="24" y="84" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#34D399">Orders saved in orders.txt</text>
<text x="24" y="103" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Backup created.</text>
<text x="24" y="122" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0"></text>
<text x="24" y="141" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#FCD34D">Enter your choice: 8</text>
<text x="24" y="160" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#34D399">Orders saved in orders.txt</text>
<text x="24" y="179" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#34D399">Data saved. Thank you!</text>
<text x="24" y="198" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0"></text>
<text x="24" y="217" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#38BDF8">$ cat orders.txt</text>
<text x="24" y="236" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">1001|Aman Sharma|9876543210|3 Shirts|Washing|3|Pickup|150.0|Ready|true</text>
<text x="24" y="255" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">1002|Priya Verma|9812345678|2 Blazers|Dry Cleaning|2|Delivery|200.0|Ready|true</text>
<text x="24" y="274" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">1003|Rohit Kumar|9988776655|5 Shirts|Ironing|5|Pickup|150.0|Received|false</text>
<text x="24" y="293" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0"></text>
<text x="24" y="312" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#38BDF8">$ ls -l orders*.txt</text>
<text x="24" y="331" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#64748B">-rw-r--r-- 1 student staff 248 Nov 20 10:45 orders.txt</text>
<text x="24" y="350" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#64748B">-rw-r--r-- 1 student staff 248 Nov 20 10:45 orders_backup.txt</text>

  </g>
</svg>
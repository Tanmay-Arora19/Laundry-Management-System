<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" width="850" height="460">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Window Container -->
  <rect x="5" y="5" width="840" height="450" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Window Titlebar -->
  <rect x="5" y="5" width="840" height="36" rx="10" fill="#1C2541"/>
  <rect x="5" y="30" width="840" height="11" fill="#1C2541"/>
  
  <!-- Window Controls -->
  <circle cx="25" cy="22" r="6" fill="#EF4444"/>
  <circle cx="43" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="61" cy="22" r="6" fill="#10B981"/>
  
  <!-- Title -->
  <text x="425" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Terminal - Application Startup & Main Menu</text>
  
  <!-- Terminal Content Area -->
  <g>
    <text x="24" y="65" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#38BDF8">$ javac LaundryOrderSystem.java</text>
<text x="24" y="84" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#38BDF8">$ java LaundryOrderSystem</text>
<text x="24" y="103" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#34D399">Previous orders loaded from file.</text>
<text x="24" y="122" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#64748B">========================================</text>
<text x="24" y="141" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">   LAUNDRY / DRY CLEANING ORDER SYSTEM</text>
<text x="24" y="160" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#64748B">========================================</text>
<text x="24" y="179" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0"></text>
<text x="24" y="198" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#64748B">--------------- MAIN MENU ---------------</text>
<text x="24" y="217" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">1. Create new laundry order</text>
<text x="24" y="236" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">2. View all orders</text>
<text x="24" y="255" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">3. Search order by ID</text>
<text x="24" y="274" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">4. Update order status</text>
<text x="24" y="293" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">5. Record payment</text>
<text x="24" y="312" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">6. Business summary</text>
<text x="24" y="331" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">7. Save and create backup</text>
<text x="24" y="350" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">8. Save and exit</text>
<text x="24" y="369" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#FCD34D">Enter your choice: _</text>

  </g>
</svg>
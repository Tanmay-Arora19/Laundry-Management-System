<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" width="850" height="620">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Window Container -->
  <rect x="5" y="5" width="840" height="610" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Window Titlebar -->
  <rect x="5" y="5" width="840" height="36" rx="10" fill="#1C2541"/>
  <rect x="5" y="30" width="840" height="11" fill="#1C2541"/>
  
  <!-- Window Controls -->
  <circle cx="25" cy="22" r="6" fill="#EF4444"/>
  <circle cx="43" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="61" cy="22" r="6" fill="#10B981"/>
  
  <!-- Title -->
  <text x="425" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Terminal - Option 1: Order Creation & Billing</text>
  
  <!-- Terminal Content Area -->
  <g>
    <text x="24" y="65" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#FCD34D">Enter your choice: 1</text>
<text x="24" y="84" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0"></text>
<text x="24" y="103" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#64748B">--- Create New Order ---</text>
<text x="24" y="122" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#93C5FD">Customer name: Aman Sharma</text>
<text x="24" y="141" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Phone number: 9876543210</text>
<text x="24" y="160" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Garment details (e.g. 2 shirts): 3 Shirts</text>
<text x="24" y="179" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Available services:</text>
<text x="24" y="198" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#A7F3D0">1. Washing - Rs. 50.00 per garment</text>
<text x="24" y="217" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#A7F3D0">2. Dry Cleaning - Rs. 100.00 per garment</text>
<text x="24" y="236" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#A7F3D0">3. Ironing - Rs. 30.00 per garment</text>
<text x="24" y="255" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#FCD34D">Choose service (1-3): 1</text>
<text x="24" y="274" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Number of garments: 3</text>
<text x="24" y="293" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Pickup or Delivery (enter Pickup/Delivery): Pickup</text>
<text x="24" y="312" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0"></text>
<text x="24" y="331" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#34D399">Order created successfully!</text>
<text x="24" y="350" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#64748B">----------------------------------------</text>
<text x="24" y="369" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#93C5FD">Order ID       : 1001</text>
<text x="24" y="388" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#93C5FD">Customer       : Aman Sharma</text>
<text x="24" y="407" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Phone          : 9876543210</text>
<text x="24" y="426" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Garment        : 3 Shirts</text>
<text x="24" y="445" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Service        : Washing</text>
<text x="24" y="464" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Quantity       : 3</text>
<text x="24" y="483" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Pickup/Delivery: Pickup</text>
<text x="24" y="502" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Order Status   : Received</text>
<text x="24" y="521" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#93C5FD">Total Amount   : Rs. 150.00</text>
<text x="24" y="540" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#E2E8F0">Payment        : Pending</text>
<text x="24" y="559" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="normal" fill="#64748B">----------------------------------------</text>
<text x="24" y="578" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#4ADE80">[Notification] Order 1001 has been received for Aman Sharma.</text>

  </g>
</svg>